[project]
name = "open-source-nvr-detector"
version = "0.1.0"
description = "Object detection module for Open Source NVR system"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "FOSS-nvrplus contributors"},
]
keywords = ["object-detection", "nvr", "computer-vision", "coral", "edgetpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.4",
    "opencv-python-headless>=4.5.0",
    "onnxruntime>=1.15.0",  # For ONNX inference
]

[project.optional-dependencies]
# Coral Edge TPU (also needs the libedgetpu1-std system package)
coral = ["tflite-runtime>=2.5; python_version < '3.12'", "ai-edge-litert; python_version >= '3.12'"]
# Used by scripts/fetch-model.sh to export the ONNX model
export = ["ultralytics"]



[project.scripts]
nvr-detect = "detector.detect:main"

[project.urls]
Homepage = "https://github.com/man-or-wolf/FOSS-nvrplus"
Repository = "https://github.com/man-or-wolf/FOSS-nvrplus"
Issues = "https://github.com/man-or-wolf/FOSS-nvrplus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["detector*", "py_utils*"]
